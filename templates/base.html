<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceAttendance{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #13131f; --surface2: #1a1a2e;
            --border: #252540; --text: #e2e8f0; --text2: #94a3b8;
            --accent: #7c3aed; --accent2: #a78bfa; --green: #10b981;
            --red: #ef4444; --amber: #f59e0b;
            --radius: 16px; --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; display: flex;
        }
        .sidebar {
            width: 270px; min-height: 100vh; background: var(--surface);
            border-right: 1px solid var(--border); position: fixed;
            left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column;
        }
        .sidebar-logo { padding: 30px 24px 20px; border-bottom: 1px solid var(--border); }
        .sidebar-logo .logo-icon {
            width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; margin-bottom: 14px;
        }
        .sidebar-logo h2 { font-size: 1.1em; font-weight: 700; }
        .sidebar-logo .version { font-size: 0.7em; color: var(--text2); }
        .course-pill {
            display: inline-block; background: rgba(124,58,237,0.15); color: var(--accent2);
            padding: 5px 14px; border-radius: 20px; font-size: 0.75em; font-weight: 600;
            margin-top: 10px; border: 1px solid rgba(124,58,237,0.3);
        }
        .sidebar-nav { flex: 1; padding: 20px 16px; }
        .nav-group { margin-bottom: 24px; }
        .nav-group-title {
            font-size: 0.65em; text-transform: uppercase; letter-spacing: 0.1em;
            color: #555; padding: 0 12px; margin-bottom: 8px; font-weight: 600;
        }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text2); text-decoration: none; font-size: 0.9em; font-weight: 500;
            border-radius: var(--radius-sm); transition: all 0.2s; margin-bottom: 3px;
        }
        .nav-link:hover { background: var(--surface2); color: #fff; }
        .nav-link.active { background: rgba(124,58,237,0.12); color: var(--accent2); border-left: 3px solid var(--accent); }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .btn-switch {
            display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 16px;
            background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.25);
            border-radius: var(--radius-sm); cursor: pointer; text-decoration: none;
            font-family: 'Space Grotesk', sans-serif; font-size: 0.85em; font-weight: 500;
        }
        .btn-switch:hover { background: rgba(239,68,68,0.08); }
        .main { margin-left: 270px; flex: 1; padding: 36px 44px; }
        .page-header { margin-bottom: 36px; }
        .page-header h1 { font-size: 1.7em; font-weight: 700; }
        .page-header p { color: var(--text2); font-size: 0.9em; margin-top: 4px; }
        .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 36px; }
        .stat-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; position: relative; overflow: hidden;
        }
        .stat-box .glow {
            position: absolute; top: -20px; right: -20px; width: 80px; height: 80px;
            border-radius: 50%; filter: blur(40px); opacity: 0.3;
        }
        .stat-box.total .glow { background: #6366f1; }
        .stat-box.present .glow { background: var(--green); }
        .stat-box.absent .glow { background: var(--red); }
        .stat-box .icon { font-size: 1.5em; margin-bottom: 12px; }
        .stat-box .number { font-size: 2.4em; font-weight: 700; }
        .stat-box .label { font-size: 0.85em; color: var(--text2); font-weight: 500; }
        .stat-box.total .number { color: #818cf8; }
        .stat-box.present .number { color: var(--green); }
        .stat-box.absent .number { color: var(--red); }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
        }
        .card-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
        }
        .card-head h3 { font-size: 1em; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px 16px; font-size: 0.7em; font-weight: 600;
            color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.88em; }
        tr:hover td { background: var(--surface2); }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.78em; font-weight: 600; }
        .tag-purple { background: rgba(124,58,237,0.2); color: var(--accent2); }
        .tag-green { background: rgba(16,185,129,0.15); color: var(--green); }
        .tag-red { background: rgba(239,68,68,0.15); color: var(--red); }
        .empty { text-align: center; padding: 48px; color: var(--text2); }
        .empty .big { font-size: 3em; margin-bottom: 12px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
            border-radius: var(--radius-sm); font-size: 0.88em; font-weight: 600;
            text-decoration: none; cursor: pointer; border: none;
            font-family: 'Space Grotesk', sans-serif; transition: all 0.2s;
        }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: #6d28d9; }
        .video-box {
            background: #000; border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--border); margin-bottom: 24px;
        }
        #video-feed { width: 100%; display: block; max-height: 460px; object-fit: contain; }
        .status-line {
            text-align: center; padding: 14px 20px; border-radius: var(--radius-sm);
            margin-bottom: 20px; font-weight: 600; font-size: 0.9em;
        }
        .status-wait { background: var(--surface2); color: var(--text2); }
        .status-see { background: rgba(124,58,237,0.1); color: var(--accent2); }
        .status-done { background: rgba(16,185,129,0.1); color: var(--green); }
        .status-finish { background: rgba(245,158,11,0.1); color: var(--amber); }
        .input-field {
            width: 100%; padding: 14px 16px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: #fff; font-size: 1em; font-family: 'Space Grotesk', sans-serif;
            outline: none;
        }
        .input-field:focus { border-color: var(--accent); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; min-height: auto; }
            .main { margin-left: 0; padding: 20px; }
            .stat-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {% if course %}
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">👁️</div>
            <h2>FaceAttendance</h2>
            <div class="version">System v1.0</div>
            <span class="course-pill">{{ course }}</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-group-title">Main Menu</div>
                <a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}">
                    <span>📊</span> Dashboard
                </a>
                <a href="{{ url_for('mark') }}" class="nav-link {{ 'active' if request.endpoint == 'mark' }}">
                    <span>📸</span> Mark Attendance
                </a>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">Reports</div>
                <a href="{{ url_for('present') }}" class="nav-link {{ 'active' if request.endpoint == 'present' }}">
                    <span>✅</span> Present
                </a>
                <a href="{{ url_for('absent') }}" class="nav-link {{ 'active' if request.endpoint == 'absent' }}">
                    <span>❌</span> Absent
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <a href="{{ url_for('select_course') }}" class="btn-switch">
                <span>🔄</span> Change Course
            </a>
        </div>
    </aside>
    {% endif %}
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
